{% extends 'base.html' %}
{% block content %}
  <h1>最新文章</h1>
  {% for post in posts %}
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title"><a href="{{ url_for('post_view', post_id=post['id']) }}">{{ post['title'] }}</a></h5>
        <p class="card-text">{{ post['content'][:200] }}{% if post['content']|length > 200 %}...{% endif %}</p>
        {% if post['image'] %}
          <img src="{{ url_for('static', filename='uploads/' + post['image']) }}" alt="" class="img-fluid" style="max-height:200px;">
        {% endif %}
        <p class="text-muted small">{{ post['created'] }}</p>
      </div>
    </div>
  {% else %}
    <p>目前尚無文章，請新增一篇！</p>
  {% endfor %}
{% endblock %}
