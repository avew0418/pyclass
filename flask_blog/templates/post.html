{% extends 'base.html' %}
{% block content %}
  <h1>{{ post['title'] }}</h1>
  <p class="text-muted small">{{ post['created'] }}</p>
  {% if post['image'] %}
    <img src="{{ url_for('static', filename='uploads/' + post['image']) }}" class="img-fluid mb-3" style="max-height:400px;">
  {% endif %}
  <div class="mb-4">{{ post['content'] }}</div>

  <h4>留言</h4>
  {% for c in comments %}
    <div class="mb-2 border p-2">
      <strong>{{ c['author'] }}</strong>
      <p class="mb-0">{{ c['content'] }}</p>
      <div class="text-muted small">{{ c['created'] }}</div>
    </div>
  {% else %}
    <p>尚無留言</p>
  {% endfor %}

  <form method="post" class="mt-3">
    <div class="mb-2">
      <label class="form-label">姓名</label>
      <input class="form-control" name="author" placeholder="Your name">
    </div>
    <div class="mb-2">
      <label class="form-label">留言</label>
      <textarea class="form-control" name="content" rows="3" required></textarea>
    </div>
    <button class="btn btn-primary" type="submit">送出留言</button>
  </form>
{% endblock %}
